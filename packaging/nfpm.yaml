# .deb and .rpm packages of the generic Linux build (no Omarchy integration).
# Built in CI: VERSION=0.1.0-alpha nfpm package -f packaging/nfpm.yaml -p deb -t dist/
# Paths are relative to the repository root; binaries come from target/release.
name: lastai
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: devel
priority: optional
maintainer: TheSyrianDev <215098066+TheSyrianDev@users.noreply.github.com>
description: Team-first local AI harness, departments and workers, local-first.
vendor: TheSyrianDev
homepage: https://github.com/TheSyrianDev/LastAI
license: LicenseRef-LastAI
contents:
  - src: target/release/lastai-gui
    dst: /usr/bin/lastai-gui
    file_info: {mode: 0755}
  - src: target/release/lastaid
    dst: /usr/bin/lastaid
    file_info: {mode: 0755}
  - src: target/release/la
    dst: /usr/bin/la
    file_info: {mode: 0755}
  - src: target/release/lastai
    dst: /usr/bin/lastai
    file_info: {mode: 0755}
  - src: packaging/lastai.desktop
    dst: /usr/share/applications/lastai.desktop
    file_info: {mode: 0644}
  - src: packaging/lastai.png
    dst: /usr/share/icons/hicolor/512x512/apps/lastai.png
    file_info: {mode: 0644}
  - src: LICENSE
    dst: /usr/share/licenses/lastai/LICENSE
    file_info: {mode: 0644}
  - src: COMMERCIAL-LICENSING.md
    dst: /usr/share/licenses/lastai/COMMERCIAL-LICENSING.md
    file_info: {mode: 0644}
overrides:
  deb:
    depends: [libgtk-3-0, fontconfig, libvulkan1]
  rpm:
    depends: [gtk3, fontconfig, vulkan-loader]
