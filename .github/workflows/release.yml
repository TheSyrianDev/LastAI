name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev libfontconfig-dev libssl-dev libdbus-1-dev libasound2-dev libgtk-3-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Get linuxdeploy
        run: |
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
      - name: Stamp version from tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ver="${GITHUB_REF_NAME#v}"
            sed -i.bak "s/^version = \"0.0.0\"$/version = \"$ver\"/" Cargo.toml && rm -f Cargo.toml.bak
          fi
      - name: Build the AppImage
        env:
          LINUXDEPLOY: ${{ github.workspace }}/linuxdeploy
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.AppImage

  omarchy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev libfontconfig-dev libssl-dev libdbus-1-dev libasound2-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version from tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ver="${GITHUB_REF_NAME#v}"
            sed -i.bak "s/^version = \"0.0.0\"$/version = \"$ver\"/" Cargo.toml && rm -f Cargo.toml.bak
          fi
      - name: Build
        run: |
          cargo build --release -p lh-core -p lh-tui
          cargo build --release -p lh-gui --features omarchy
      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [[ $GITHUB_REF == refs/tags/* ]] || ver="dev-${GITHUB_SHA::7}"
          name="LastAI-$ver-omarchy-x86_64"
          d="dist/$name"
          mkdir -p "$d"
          for b in lastai-gui lastaid la lastai; do cp "target/release/$b" "$d/"; done
          cp scripts/install-omarchy.sh packaging/omarchy/lastai-icon-refresh packaging/omarchy/theme-set-hook packaging/lastai.desktop packaging/omarchy/README.md LICENSE COMMERCIAL-LICENSING.md "$d/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy
          path: dist/*.tar.gz
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version from tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ver="${GITHUB_REF_NAME#v}"
            sed -i.bak "s/^version = \"0.0.0\"$/version = \"$ver\"/" Cargo.toml && rm -f Cargo.toml.bak
          fi
      - name: Build
        run: |
          cargo build --release -p lh-core -p lh-tui
          cargo build --release -p lh-gui --no-default-features
      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $dir = "dist/LastAI"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($b in 'lastai-gui','lastaid','la','lastai') { Copy-Item "target/release/$b.exe" $dir }
          Copy-Item README.md, LICENSE, COMMERCIAL-LICENSING.md $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/LastAI-$ver-windows-x64.zip"
          Get-ChildItem dist
      - name: Smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          $d = "dist/LastAI"
          $state = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/lh-smoke"
          $tok = "$state/token"
          $lhd = Start-Process -FilePath "$d/lhd.exe" -ArgumentList "--listen","127.0.0.1:17842","--token-file",$tok,"--store","$state/lh.db","--provider","http://127.0.0.1:9/v1" -PassThru -RedirectStandardError "$state/lhd.err" -RedirectStandardOutput "$state/lhd.out"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 1
            if (Test-Path $tok) {
              $t = (Get-Content $tok -Raw).Trim()
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:17842/v1/health" -Headers @{ Authorization = "Bearer $t" }
                Write-Host "health: $($r.StatusCode) $($r.Content)"
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Write-Host "not yet: $_" }
            }
          }
          Get-Content "$state/lhd.err" -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "SMOKE: lhd health FAILED" } else { Write-Host "SMOKE: lhd health OK" }
          & "$d/lh.exe" --help; Write-Host "SMOKE: lh --help exit $LASTEXITCODE"
          $gui = Start-Process -FilePath "$d/lastai-gui.exe" -PassThru -RedirectStandardError "$state/gui.err" -RedirectStandardOutput "$state/gui.out"
          Start-Sleep 10
          if ($gui.HasExited) { Write-Host "SMOKE: GUI exited early, code $($gui.ExitCode)" } else { Write-Host "SMOKE: GUI still running after 10 s"; Stop-Process -Id $gui.Id -Force }
          Get-Content "$state/gui.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
          Stop-Process -Id $lhd.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version from tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ver="${GITHUB_REF_NAME#v}"
            sed -i.bak "s/^version = \"0.0.0\"$/version = \"$ver\"/" Cargo.toml && rm -f Cargo.toml.bak
          fi
      - name: Build
        run: |
          cargo build --release -p lh-core -p lh-tui
          cargo build --release -p lh-gui --no-default-features
      - name: Bundle the app and the disk image
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="$GITHUB_REF_NAME"; else ver="dev-${GITHUB_SHA:0:7}"; fi
          app="dist/LastAI.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          for b in lastai-gui lastaid la lastai; do cp "target/release/$b" "$app/Contents/MacOS/"; done
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Last AI</string>
            <key>CFBundleIdentifier</key><string>dev.lastai.app</string>
            <key>CFBundleExecutable</key><string>lastai-gui</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${ver#v}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # App icon from the 256x256 source png. Sizes above 256 are upscales, so they will look soft.
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          src=packaging/lastai.png
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" "$src" --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z "$((s * 2))" "$((s * 2))" "$src" --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          # Ad-hoc signature only. Not Developer ID signed and not notarised.
          codesign --force --deep --sign - "$app"
          # Stage the disk image contents in a temp folder, not in dist/.
          stage="$RUNNER_TEMP/dmg-stage"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R "$app" "$stage/"
          cp README.md LICENSE COMMERCIAL-LICENSING.md "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Last AI" -srcfolder "$stage" -ov -format UDZO "LastAI-$ver-macos-arm64.dmg"
          mv LastAI-*.dmg dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.dmg
